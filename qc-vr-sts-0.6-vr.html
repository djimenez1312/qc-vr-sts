<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QC VR STS 0.6 · Quest 3</title><style>body{margin:0;background:#061722;color:#e3f5ff;font:14px system-ui}#hud{position:fixed;top:12px;left:12px;background:#0b2738dc;padding:14px;border:1px solid #47788e;border-radius:10px;max-width:420px;z-index:3}button{background:#165a70;color:white;padding:10px;border:1px solid #6db4ca;border-radius:6px;margin:3px}#vr{position:fixed;bottom:20px;right:20px;z-index:4}#hud small{color:#9ac9d5}canvas{display:block}</style></head><body><div id="hud"><b>QC VR STS 0.6 · META QUEST 3</b><p id="status">Cargando sala virtual…</p><small>Stick izquierdo: trolley horizontal / gantry vertical. Stick derecho: hoist. Apunta con el controlador a los botones de consola y pulsa el gatillo.</small><p><button id="ct">ENTRADA CT</button><button id="lock">LOCK</button><button id="bay">BAY</button><button id="reset">RESET</button></p></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import{VRButton}from'three/addons/webxr/VRButton.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#0b2636');const cam=new T.PerspectiveCamera(75,innerWidth/innerHeight,.05,80);cam.position.set(0,1.65,2.5);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.7));r.xr.enabled=true;document.body.appendChild(r.domElement);const vr=VRButton.createButton(r);vr.id='vr';document.body.appendChild(vr);const orbit=new OrbitControls(cam,r.domElement);orbit.target.set(0,1.4,-1.5);orbit.enablePan=false;orbit.update();
scene.add(new T.HemisphereLight(0xbfeaff,0x203040,2.4));const light=new T.PointLight(0xd8faff,32,8);light.position.set(0,2.5,0);scene.add(light);
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.6}),steel=mat('#416170'),dark=mat('#142d3b'),floor=mat('#33434e'),yellow=mat('#ddb65e');
function box(x,y,z,w,h,d,m){const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
box(0,-.06,-1.5,7,.12,8,floor);box(0,2.9,-1.5,7,.15,8,dark);box(-3.5,1.4,-1.5,.1,3,8,dark);box(3.5,1.4,-1.5,.1,3,8,dark);box(0,1.4,-5.5,7,3,.12,dark);box(0,.78,-1.05,3.7,.12,1,steel);box(0,.55,-1.4,3.5,.5,.15,dark);box(0,.75,.45,.55,.12,.5,dark);box(0,1.1,.7,.6,.7,.12,dark);
for(const x of [-1.4,1.4]){box(x,1.05,-.65,.3,.1,.3,dark);box(x,1.25,-.65,.07,.4,.07,steel);box(x,1.45,-.65,.17,.1,.17,yellow)}
const state={x:-3.45,g:0,h:1.6,ct:-24,enter:false,loaded:false,done:false,bay:8};const status=document.querySelector('#status');const canv=[],ctx=[],tex=[];
function screen(x,y,z,w,h){box(x,y,z,w+.08,h+.08,.06,steel);const c=document.createElement('canvas');c.width=640;c.height=360;const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:t}));m.position.set(x,y,z+.05);scene.add(m);canv.push(c);ctx.push(c.getContext('2d'));tex.push(t)}
screen(-.82,1.8,-1.94,1.7,1.05);screen(1,2.02,-1.94,1.25,.72);screen(1,1.2,-1.94,1.25,.72);
const clickable=[];function label(s){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.fillStyle='#17495a';g.fillRect(0,0,256,64);g.fillStyle='white';g.textAlign='center';g.font='bold 26px sans-serif';g.fillText(s,128,42);return new T.MeshBasicMaterial({map:new T.CanvasTexture(c),side:T.DoubleSide})}
function key(x,s,action){box(x,.96,-.9,.43,.07,.24,yellow);const m=new T.Mesh(new T.PlaneGeometry(.4,.2),label(s));m.rotation.x=-Math.PI/2;m.position.set(x,1.006,-.9);m.userData.action=action;scene.add(m);clickable.push(m)}
key(-1.35,'CT','ct');key(-.8,'LOCK','lock');key(-.25,'BAY','bay');key(.3,'RESET','reset');
function act(a){if(a==='reset'){Object.assign(state,{x:-3.45,g:0,h:1.6,ct:-24,enter:false,loaded:false,done:false,bay:8});status.textContent='Reiniciado';return}if(a==='ct'){state.enter=true;status.textContent='CT entrando desde popa hacia proa';return}if(a==='bay'){state.bay=state.bay===10?6:state.bay+2;status.textContent='BAY '+state.bay;return}if(a==='lock'){if(state.ct<0)return status.textContent='Espera a que llegue el CT';const target=state.loaded?8:-3.45,gy=state.loaded?(state.bay-8)*6:0;if(Math.abs(state.x-target)>.8||Math.abs(state.g-gy)>1)return status.textContent='Alinea trolley y gantry';if(state.h>.65)return status.textContent='Baja hoist por debajo de 0.65 m';if(state.loaded){state.done=true;state.loaded=false;status.textContent='Contenedor depositado en BAY '+state.bay}else{state.loaded=true;status.textContent='LOCK confirmado. Eleva y lleva al buque'}}}
for(const a of ['ct','lock','bay','reset'])document.getElementById(a).onclick=()=>act(a);
const controllers=[r.xr.getController(0),r.xr.getController(1)],ray=new T.Raycaster(),matrix=new T.Matrix4();for(const controller of controllers){scene.add(controller);controller.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3(0,0,-3)]),new T.LineBasicMaterial({color:0x83faff})));controller.addEventListener('selectstart',()=>{matrix.identity().extractRotation(controller.matrixWorld);ray.ray.origin.setFromMatrixPosition(controller.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(matrix);const hit=ray.intersectObjects(clickable)[0];if(hit)act(hit.object.userData.action)})}
const rect=(q,x,y,w,h,c)=>{q.fillStyle=c;q.fillRect(x,y,w,h)},txt=(q,s,x,y,size=18)=>{q.fillStyle='#e9f9ff';q.font='bold '+size+'px monospace';q.fillText(s,x,y)};
function draw(i){const q=ctx[i];rect(q,0,0,640,360,'#204c5e');rect(q,0,0,640,38,'#0c2838');txt(q,['CAM 01 · TROLLEY','CAM 02 · PERFIL STS','CAM 03 · BAYS / GANTRY'][i],14,25,19);
if(i===0){rect(q,0,38,408,322,'#758c90');rect(q,408,38,232,322,'#b47d69');for(let j=0;j<4;j++){rect(q,j*100+12,38,2,322,'#efdaa0');txt(q,'CT'+(j+1),j*100+23,342,16)}const cy=170-state.ct*5;rect(q,225,cy-28,37,78,'#d7b26a');rect(q,228,cy+4,31,38,'#ba8154');txt(q,'PROA ↑',520,73);txt(q,'POPA ↓',520,339);txt(q,'BUQUE →',480,105)}
if(i===1){rect(q,0,280,640,80,'#758b8c');rect(q,470,260,170,25,'#af746a');rect(q,45,65,14,215,'#e7bd62');rect(q,450,65,14,215,'#e7bd62');rect(q,30,60,610,14,'#e7bd62');const px=75+(state.x+11.6)/24*530;rect(q,px-14,58,28,20,'#f3d587');rect(q,px-2,75,4,190-state.h*25,'white');rect(q,px-24,263-state.h*25,48,12,'#81f1f0');txt(q,'MUELLE',70,338);txt(q,'BUQUE',500,338)}
if(i===2){rect(q,0,38,310,322,'#70898e');rect(q,310,38,330,322,'#b47569');for(let j=0;j<4;j++){rect(q,20+j*70,40,50,320,j===2?'#8da596':'#667e84');txt(q,''+(j+1),40+j*70,339)}for(let k=0;k<3;k++){const yy=93+k*102-state.g*7;rect(q,380,yy-34,200,68,'#7695a1');txt(q,'BAY '+(6+k*2),418,yy+8)}txt(q,'PROA ↑',522,62)}
txt(q,'TROLLEY '+state.x.toFixed(1),12,65,14);txt(q,'GANTRY '+state.g.toFixed(1),12,85,14);txt(q,'HOIST '+state.h.toFixed(1),12,105,14);txt(q,state.done?'FINALIZADO':state.loaded?'CARGADO':'SIN CARGA',12,125,14);tex[i].needsUpdate=true}
const dead=x=>Math.abs(x)>.2?x:0;let last=performance.now(),n=0;r.setAnimationLoop(t=>{const dt=Math.min(.05,(t-last)/1000||0);last=t;for(const s of r.xr.getSession()?.inputSources||[]){const g=s.gamepad;if(!g)continue;const x=dead(g.axes?.[2]??g.axes?.[0]??0),y=dead(g.axes?.[3]??g.axes?.[1]??0);if(s.handedness==='left'){state.x=T.MathUtils.clamp(state.x+x*3*dt,-11.6,12.3);state.g=T.MathUtils.clamp(state.g+y*4*dt,-14,14)}else if(s.handedness==='right')state.h=T.MathUtils.clamp(state.h-y*1.5*dt,0,4.8)}if(state.enter){state.ct=Math.min(0,state.ct+6*dt);if(state.ct===0){state.enter=false;status.textContent='CT posicionado en carril 3'}}if(++n%3===0)for(let i=0;i<3;i++)draw(i);if(!r.xr.isPresenting)orbit.update();r.render(scene,cam)});window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});status.textContent='Sala lista. En Quest Browser pulsa ENTRAR EN VR.';
</script></body></html>
