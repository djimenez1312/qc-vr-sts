<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QC VR STS 0.7 Alpha | Rotterdam Edition</title><style>html,body{margin:0;overflow:hidden;background:#071724;color:#d9f5ff;font-family:system-ui}#hud{position:fixed;z-index:3;left:12px;top:12px;width:min(440px,85vw);background:#092233e8;border:1px solid #568b9b;border-radius:12px;padding:12px;box-shadow:0 8px 24px #0007}h2{font-size:16px;margin:0 0 8px}p{font-size:12px;margin:7px 0}button{padding:9px 11px;margin:3px;background:#1b6178;color:white;border:1px solid #72b7c7;border-radius:6px;cursor:pointer}#msg{color:#ffe1a0}#vr{position:fixed;right:15px;bottom:18px;z-index:4}#hud small{color:#b5d5e0}canvas{display:block}</style></head><body><div id="hud"><h2>QC VR STS 0.7 ALPHA · ROTTERDAM EDITION</h2><p id="msg">Iniciando escena portuaria 3D...</p><p><button id="arrive">1 · LLAMAR AGV</button><button id="twist">2 · LOCK / UNLOCK</button><button id="bay">BAY: 08</button><button id="reset">REINICIAR</button></p><p><small>PC: A/D trolley · W/S gantry · ↑/↓ hoist · E lock/unlock · C llamar AGV. Quest 3: stick izquierdo trolley/gantry; derecho hoist; gatillo sobre botones de consola. CAM 01 = trolley.</small></p></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import {VRButton} from 'three/addons/webxr/VRButton.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const scene=new T.Scene();scene.background=new T.Color('#93b8c7');scene.fog=new T.Fog('#93b8c7',100,270);
const camera=new T.PerspectiveCamera(75,innerWidth/innerHeight,.05,500);camera.position.set(0,1.7,2.65);

const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.5,-1.65);orbit.enablePan=false;orbit.maxDistance=5;orbit.minDistance=.5;orbit.update();
scene.add(new T.HemisphereLight(0xffffff,0x526c78,2.2));const sun=new T.DirectionalLight(0xfff4db,2.6);sun.position.set(25,70,25);scene.add(sun);
const m=(color,metalness=0)=>new T.MeshStandardMaterial({color,metalness,roughness:.65}), steel=m('#f1c74e',.35), blue=m('#12526d',.3),dark=m('#19313e'),concrete=m('#808e8e'),water=m('#326a80'),white=m('#d9e7e6'),rubber=m('#151e25'),red=m('#b94c3e'),green=m('#318379'),shipmat=m('#923e38',.3);
const box=(parent,x,y,z,w,h,d,mat)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);parent.add(o);return o};
const cyl=(parent,x,y,z,r,h,mat)=>{const o=new T.Mesh(new T.CylinderGeometry(r,r,h,10),mat);o.position.set(x,y,z);parent.add(o);return o};
function sign(txt,w=512,h=90){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#0d3446';g.fillRect(0,0,w,h);g.fillStyle='#d9f7ff';g.font='bold 32px monospace';g.textAlign='center';g.fillText(txt,w/2,h*.65);return new T.MeshBasicMaterial({map:new T.CanvasTexture(c),side:T.DoubleSide})}
function tag(parent,x,y,z,text,w=2){const o=new T.Mesh(new T.PlaneGeometry(w,.34),sign(text));o.position.set(x,y,z);parent.add(o);return o}
const port=new T.Group();scene.add(port);box(port,-12,-.55,0,28,1,80,concrete);box(port,10,-.7,0,17,.8,90,water);box(port,1.5,-.4,0,.3,.8,80,dark);
for(const x of [-11.7,2.4]){box(port,x,.08,0,.25,.17,72,steel);for(let z=-34;z<36;z+=3)box(port,x,.02,z,.7,.12,.35,dark)}
for(const x of [-9.6,-6.7,-3.8,-.9]){box(port,x,.015,0,.07,.035,72,white);for(let z=-35;z<35;z+=5)box(port,x,.018,z,.09,.05,1.5,steel)}
const ship=new T.Group();port.add(ship);box(ship,12,1.25,0,17,2.5,67,shipmat);box(ship,12,2.55,0,15.9,.25,65,dark);box(ship,12,3.2,29,14,1.3,5,white);box(ship,12,4.5,29,10,1.3,3,white);
const colors=[blue,red,green,white,m('#b8a258'),m('#6c84a0')];
function container(parent,x,y,z,w=5.9,depth=2.44,col=blue){const g=new T.Group();parent.add(g);g.position.set(x,y,z);box(g,0,0,0,w,2.55,depth,col);for(let k=-w/2+.28;k<w/2;k+=.42){box(g,k,0,depth/2+.014,.055,2.4,.03,white);box(g,k,0,-depth/2-.014,.055,2.4,.03,white)}for(const sx of [-1,1])for(const sz of [-1,1])box(g,sx*(w/2-.13),0,sz*(depth/2-.09),.16,2.65,.16,steel);return g}
for(let zi=-26;zi<=26;zi+=7)for(let xi=0;xi<2;xi++)for(let level=0;level<2;level++)container(ship,7.6+xi*7,4.65+level*2.65,zi,5.9,2.4,colors[(zi+28+xi+level*2)%colors.length]);
const crane=new T.Group();port.add(crane);const gantry=new T.Group();crane.add(gantry);
for(const x of [-11.7,2.4])for(const z of [-7.5,7.5]){box(gantry,x,13,z,.8,26,.8,steel);box(gantry,x,1.2,z,1.7,2.4,1.8,dark)}
for(const z of [-7.5,7.5]){box(gantry,-4.7,24.5,z,15,.9,.8,steel);box(gantry,-4.7,17,z,15,.6,.5,steel)}
box(gantry,0,26,0,40,1.25,1.25,steel);box(gantry,0,27,0,40,.3,.7,dark);for(let x=-15;x<20;x+=5){const strut=box(gantry,x,30,0,.28,8,.3,steel);strut.rotation.z=x<0?.5:-.5}box(gantry,-5,34,0,23,.5,.5,steel);
const trolley=new T.Group();gantry.add(trolley);box(trolley,0,26.3,0,3.4,.65,4,blue);for(const z of [-1.45,1.45])for(const x of [-1.2,1.2])cyl(trolley,x,25.75,z,.33,.5,rubber);
const hoist=new T.Group();trolley.add(hoist);for(const x of [-1.2,1.2])for(const z of [-1,1])box(hoist,x,-7,z,.055,14,.055,white);box(hoist,0,-14,0,6.4,.55,2.5,steel);for(const x of [-2.7,2.7])for(const z of [-.9,.9])box(hoist,x,-14.48,z,.2,.55,.2,dark);
const agv=new T.Group();port.add(agv);box(agv,0,.72,0,3,1.1,7,green);box(agv,0,1.32,0,3.1,.16,6.6,dark);for(const x of [-1.3,1.3])for(const z of [-2.2,2.2]){const wheel=cyl(agv,x,.4,z,.42,.2,rubber);wheel.rotation.z=Math.PI/2}box(agv,0,.35,3.55,2.3,.25,.4,steel);const cargo=container(agv,0,2.66,0,5.9,2.4,blue);cargo.rotation.y=Math.PI/2;
const hanging=container(hoist,0,-16,0,5.9,2.4,blue);hanging.visible=false;hanging.rotation.y=0;
const control=new T.Group();scene.add(control);const roomMat=m('#273d4a'),trim=m('#3f6978');box(control,0,-.08,-1.4,7,.15,8,roomMat);box(control,0,3,-1.4,7,.16,8,roomMat);box(control,0,1.4,-5.4,7,3,.12,roomMat);box(control,-3.5,1.4,-1.4,.13,3,8,roomMat);box(control,3.5,1.4,-1.4,.13,3,8,roomMat);
box(control,0,.78,-1.15,3.8,.18,1.15,trim);box(control,0,.53,-1.45,3.6,.55,.15,roomMat);box(control,0,.63,.6,.7,.14,.7,roomMat);box(control,0,1,.9,.68,.7,.14,roomMat);
for(const x of [-1.35,1.35]){box(control,x,.95,-.68,.35,.13,.35,roomMat);box(control,x,1.18,-.68,.08,.4,.08,trim);box(control,x,1.4,-.68,.18,.12,.18,steel)}
const monitors=[],targets=[],cams=[];
function monitor(x,y,z,w,h,title){box(control,x,y,z,w+.1,h+.1,.08,trim);const rt=new T.WebGLRenderTarget(1024,576,{depthBuffer:true});const face=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:rt.texture,side:T.DoubleSide}));face.position.set(x,y,z+.07);control.add(face);targets.push(rt);monitors.push(face);const c=new T.PerspectiveCamera(70,16/9,.1,300);port.add(c);cams.push(c);tag(control,x,y+h/2+.18,z+.09,title,w*.7)}
monitor(-.92,1.85,-1.99,1.85,1.05,'CAM 01 · TROLLEY');monitor(1.08,2.08,-1.99,1.4,.79,'CAM 02 · LATERAL');monitor(1.08,1.18,-1.99,1.4,.79,'CAM 03 · BAYS');
const actions=[];function key(x,text,action){box(control,x,.93,-.86,.43,.09,.25,steel);const p=new T.Mesh(new T.PlaneGeometry(.41,.2),sign(text));p.rotation.x=-Math.PI/2;p.position.set(x,.987,-.86);p.userData.action=action;control.add(p);actions.push(p)}
key(-1.35,'AGV','arrive');key(-.78,'LOCK','twist');key(-.21,'BAY','bay');key(.36,'RESET','reset');
const state={trolley:-3.8,gantry:0,hoist:7,agvZ:-30,arriving:false,locked:false,finished:false,bay:8};const msg=document.getElementById('msg'),baybtn=document.getElementById('bay');
function action(a){if(a==='reset'){Object.assign(state,{trolley:-3.8,gantry:0,hoist:7,agvZ:-30,arriving:false,locked:false,finished:false,bay:8});msg.textContent='Escenario reiniciado';return}if(a==='arrive'){if(state.locked)return;state.arriving=true;msg.textContent='AGV en aproximación desde popa hacia proa';return}if(a==='bay'){state.bay=state.bay===10?6:state.bay+2;baybtn.textContent='BAY: '+String(state.bay).padStart(2,'0');msg.textContent='Destino BAY '+state.bay;return}if(a==='twist'){if(!state.locked){if(state.agvZ<-.5)return msg.textContent='Espera la llegada del AGV';if(Math.abs(state.trolley+3.8)>.65||Math.abs(state.gantry)>.75||state.hoist>2.2)return msg.textContent='Alinea spreader sobre AGV y baja hoist (≤2.2)';state.locked=true;msg.textContent='LOCK: contenedor recogido. Eleva y traslada al buque'}else{const destZ=(state.bay-8)*7;if(Math.abs(state.trolley-12)>.9||Math.abs(state.gantry-destZ)>1||state.hoist>3)return msg.textContent='Alinea con BAY '+state.bay+' y baja hoist (≤3)';state.locked=false;state.finished=true;msg.textContent='UNLOCK: contenedor entregado en BAY '+state.bay}}}
for(const a of ['arrive','twist','bay','reset'])document.getElementById(a).onclick=()=>action(a);
const keys=new Set();addEventListener('keydown',e=>{keys.add(e.code);if(!e.repeat){if(e.code==='KeyC')action('arrive');if(e.code==='KeyE')action('twist')}});addEventListener('keyup',e=>keys.delete(e.code));
const ray=new T.Raycaster(),rot=new T.Matrix4();for(let i=0;i<2;i++){const ctl=renderer.xr.getController(i);scene.add(ctl);const geo=new T.BufferGeometry().setFromPoints([new T.Vector3(0,0,0),new T.Vector3(0,0,-4)]);ctl.add(new T.Line(geo,new T.LineBasicMaterial({color:0x7df7ff})));ctl.addEventListener('selectstart',()=>{rot.identity().extractRotation(ctl.matrixWorld);ray.ray.origin.setFromMatrixPosition(ctl.matrixWorld);ray.ray.direction.set(0,0,-1).applyMatrix4(rot);const hit=ray.intersectObjects(actions)[0];if(hit)action(hit.object.userData.action)})}
function updateWorld(){gantry.position.z=state.gantry;trolley.position.x=state.trolley;hoist.position.y=state.hoist-7;agv.position.set(-3.8,0,state.agvZ);cargo.visible=!state.locked&&!state.finished;hanging.visible=state.locked;hanging.position.y=-16;
cams[0].position.set(state.trolley,25.8,state.gantry+1.5);cams[0].lookAt(state.trolley,0,state.gantry);cams[1].position.set(28,18,-34);cams[1].lookAt(-1,11,state.gantry);cams[2].position.set(21,22,state.gantry-26);cams[2].lookAt(9,3,state.gantry)}
const dz=v=>Math.abs(v)>.2?v:0;let last=performance.now(),frame=0;renderer.setAnimationLoop(time=>{const dt=Math.min(.05,(time-last)/1000||0);last=time;
if(keys.has('KeyA'))state.trolley-=4*dt;if(keys.has('KeyD'))state.trolley+=4*dt;if(keys.has('KeyW'))state.gantry-=4*dt;if(keys.has('KeyS'))state.gantry+=4*dt;if(keys.has('ArrowUp'))state.hoist+=2.5*dt;if(keys.has('ArrowDown'))state.hoist-=2.5*dt;
for(const src of renderer.xr.getSession()?.inputSources||[]){const g=src.gamepad;if(!g)continue;const x=dz(g.axes[2]??g.axes[0]??0),y=dz(g.axes[3]??g.axes[1]??0);if(src.handedness==='left'){state.trolley+=x*4*dt;state.gantry+=y*4*dt}else if(src.handedness==='right')state.hoist-=y*2.5*dt}
state.trolley=T.MathUtils.clamp(state.trolley,-11.3,18);state.gantry=T.MathUtils.clamp(state.gantry,-14,14);state.hoist=T.MathUtils.clamp(state.hoist,.5,14);
if(state.arriving){state.agvZ=Math.min(0,state.agvZ+6*dt);if(state.agvZ===0){state.arriving=false;msg.textContent='AGV posicionado. Alinea y baja spreader'}}updateWorld();
if(frame++%2===0){monitors.forEach(o=>o.visible=false);const wasXR=renderer.xr.enabled;renderer.xr.enabled=false;for(let i=0;i<3;i++){renderer.setRenderTarget(targets[i]);renderer.render(scene,cams[i])}renderer.setRenderTarget(null);renderer.xr.enabled=wasXR;monitors.forEach(o=>o.visible=true)}
if(!renderer.xr.isPresenting)orbit.update();renderer.render(scene,camera)});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});msg.textContent='Escenario 3D listo · llama al AGV para iniciar la maniobra';
</script></body></html>
